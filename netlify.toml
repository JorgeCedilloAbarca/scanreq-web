# LEGACY — ScanReq migró de Netlify a Cloudflare Workers.
# Este archivo se mantiene durmiente: el plan freemium de Netlify acabó
# y todos los endpoints viven ahora en scanreq-workers (Cloudflare).
#
# Fix M5: se eliminaron los redirects /api/* → /.netlify/functions y la
# configuración del plugin. Si alguien hace deploy a Netlify accidentalmente,
# se sirve únicamente el sitio estático — las funciones obsoletas de
# netlify/functions/ NO se activan porque ya no están listadas como functions
# y no hay redirect que apunte a ellas.
#
# No eliminamos el archivo del repo por compatibilidad con scripts existentes
# que esperan encontrarlo, pero su única función es el publish del sitio estático.

[build]
  publish = "."
